services:
  # Flask Backend Web Service on Render
  - type: web
    name: smart-campus-iq-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT "app:app"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: SMS_MODE
        value: demo
      - key: USE_MOCK_DB_IF_UNAVAILABLE
        value: "true"
      - key: MONGODB_URI
        sync: false
      - key: FRONTEND_URL
        value: "*"

  # React Frontend Static Site on Render
  - type: web
    name: smart-campus-iq-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: smart-campus-iq-backend
          property: host
