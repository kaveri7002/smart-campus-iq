version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - SECRET_KEY=smart-campus-iq-super-secret-key-2026
      - JWT_SECRET_KEY=jwt-super-secret-key-smart-campus-iq-2026
      - SMS_MODE=demo
      - USE_MOCK_DB_IF_UNAVAILABLE=true
      - FRONTEND_URL=*
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
